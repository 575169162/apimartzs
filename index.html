<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APIMARTZS · 图像 Playground</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<style>
/* ===== APIMARTZS · 像素风主题（大面积灰 / 小面积白） ===== */
:root{
  --bg:#d4d4d4;          /* 大面积灰：页面底 */
  --bg-deep:#c2c2c2;     /* 更深的灰：侧栏、表头 */
  --panel:#dedede;       /* 面板灰 */
  --panel-2:#d8d8d8;     /* 次级面板 */
  --white:#ffffff;       /* 小面积白：输入框 / 主按钮 / 激活态 / 图片框 */
  --ink:#262626;         /* 深灰：描边与主文字 */
  --ink-2:#4f4f4f;       /* 次级文字 */
  --ink-3:#7a7a7a;       /* 弱文字 */
  --line:#8e8e8e;        /* 细线 */
  --shadow:#9e9e9e;      /* 硬阴影颜色 */
  --fg-body:#333333;     /* 正文色（提示词等） */
  --fg-invert:#ffffff;   /* 深底上的文字色 */
  /* —— 以下为可切换主题的结构参数 —— */
  --bw:2px;              /* 常规描边宽度 */
  --bw2:3px;             /* 加强描边宽度 */
  --radius:0px;          /* 圆角（像素风为 0） */
  --sh-sm:2px 2px 0 var(--shadow);
  --sh:3px 3px 0 var(--shadow);
  --sh-lg:4px 4px 0 var(--ink);
  --sh-xl:6px 6px 0 var(--ink);
  --inset:inset -2px -2px 0 rgba(0,0,0,.10);
  --img-render:pixelated;
  --bg-pattern:
    linear-gradient(45deg,rgba(255,255,255,.16) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.16) 75%),
    linear-gradient(45deg,rgba(255,255,255,.16) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.16) 75%);
  --bg-pattern-size:8px 8px;
  --bg-pattern-pos:0 0,4px 4px;
  --ui:"Heiti SC","黑体-简","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",-apple-system,BlinkMacSystemFont,sans-serif;
  --sys:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box;border-radius:var(--radius)!important}
html,body{margin:0;padding:0;height:100%}
body{
  color:var(--ink);font-size:13px;line-height:1.55;font-family:var(--sys);
  background-color:var(--bg);
  background-image:var(--bg-pattern);
  background-size:var(--bg-pattern-size);background-position:var(--bg-pattern-pos);
  -webkit-font-smoothing:antialiased;
}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:13px}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--bg-deep);border-left:var(--bw) solid var(--ink)}
::-webkit-scrollbar-thumb{background:var(--ink);border:var(--bw) solid var(--bg-deep)}
::-webkit-scrollbar-thumb:hover{background:#000}

/* ---------------- 通用控件 ---------------- */
.label{display:block;font-family:var(--ui);font-size:12px;color:var(--ink-2);margin-bottom:6px}
.input,select.input,textarea.input{
  width:100%;background:var(--white);border:var(--bw) solid var(--ink);color:var(--ink);
  padding:8px 9px;outline:none;font-family:var(--sys);
  box-shadow:var(--inset);
}
select.input{font-family:var(--ui);font-size:13px;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:26px}
.input:focus{border-color:var(--ink);box-shadow:var(--inset),0 0 0 var(--bw) var(--white)}
textarea.input{resize:vertical;min-height:96px;line-height:1.6}
.input::placeholder{color:#9a9a9a}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:var(--bw) solid var(--ink);background:var(--panel);color:var(--ink);
  padding:8px 12px;cursor:pointer;font-family:var(--ui);font-size:13px;
  box-shadow:var(--sh-sm);transition:none;white-space:nowrap;
}
.btn:hover{background:var(--white);transform:translate(-1px,-1px);box-shadow:var(--sh-lg)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn-dark{background:var(--white);color:var(--ink);font-weight:700;box-shadow:var(--sh)}
.btn-dark:hover{background:var(--white);box-shadow:var(--sh-xl)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh-sm)}
.btn-icon{width:36px;padding:8px 0}
.btn-sm{padding:5px 10px;font-size:12px}

.switch{position:relative;width:38px;height:20px;border:var(--bw) solid var(--ink);background:var(--bg-deep);
  flex:0 0 auto;cursor:pointer;transition:none}
.switch::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;background:var(--ink);transition:none}
.switch.on{background:var(--white)}
.switch.on::after{transform:translateX(18px)}

.checkbox{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
  color:var(--ink-2);font-size:12.5px}
.checkbox input{appearance:none;width:15px;height:15px;border:var(--bw) solid var(--ink);background:var(--white);cursor:pointer;position:relative}
.checkbox input:checked::after{content:"";position:absolute;inset:2px;background:var(--ink)}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.6}

/* ---------------- 登录门 ---------------- */
.gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);
  background-image:var(--bg-pattern);background-size:var(--bg-pattern-size);
  background-position:var(--bg-pattern-pos)}
.gate-card{width:100%;max-width:430px;border:var(--bw2) solid var(--ink);background:var(--panel);padding:26px 24px 20px;
  box-shadow:var(--sh-xl)}
.gate-logo{width:64px;height:64px;object-fit:cover;display:block;margin:0 auto 14px;border:var(--bw2) solid var(--ink);
  image-rendering:var(--img-render);background:var(--white)}
.gate h1{margin:0 0 6px;font-family:var(--ui);font-size:20px;font-weight:600;text-align:center}
.gate .sub{text-align:center;color:var(--ink-2);font-size:12.5px;margin:0 0 20px;font-family:var(--ui)}
.gate .row{display:flex;align-items:stretch;border:var(--bw) solid var(--ink);background:var(--white);margin-bottom:12px}
.gate .row input{flex:1;border:none;outline:none;padding:10px;background:transparent;
  font-family:var(--ui);font-size:13px;color:var(--ink)}
.gate .row .btn{border:none;border-left:var(--bw) solid var(--ink);box-shadow:none;background:var(--bg-deep)}
.gate .row .btn:hover{background:var(--white);transform:none;box-shadow:none}
.gate .msg{min-height:18px;font-size:12px;color:#111;background:var(--white);border:var(--bw) solid var(--ink);
  padding:2px 7px;margin-top:10px;font-family:var(--ui)}
.gate .msg:empty{border:none;background:transparent;padding:0}
.gate .msg.ok{background:var(--white);border-color:var(--ink)}
.gate .tips{margin:16px 0 0;padding:14px 0 0;border-top:var(--bw) dashed var(--line);color:var(--ink-3);
  font-size:11.5px;line-height:1.9;list-style:none}
.gate .tips li::before{content:"▪ ";color:var(--ink)}

/* ---------------- 布局 ---------------- */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:118px;flex:0 0 118px;background:var(--bg-deep);border-right:var(--bw2) solid var(--ink);
  padding:12px 10px;display:flex;flex-direction:column;gap:14px}
.logo{display:flex;align-items:center;gap:7px;font-family:var(--ui);font-weight:700;font-size:14px}
.logo-mark{width:22px;height:22px;object-fit:cover;display:block;border:var(--bw) solid var(--ink);
  image-rendering:var(--img-render);background:var(--white)}
.side-nav{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.side-nav button{display:flex;align-items:center;gap:7px;border:var(--bw) solid transparent;background:transparent;
  color:var(--ink-2);padding:8px;cursor:pointer;text-align:left;font-family:var(--ui);font-size:13px;
  width:100%}
.side-nav button:hover{background:var(--panel);border-color:var(--ink);color:var(--ink)}
.side-nav button.active{background:var(--white);border-color:var(--ink);color:var(--ink);font-weight:700;
  box-shadow:var(--sh-sm)}
.side-bottom{margin-top:auto}

.form-col{width:266px;flex:0 0 266px;background:var(--panel);border-right:var(--bw2) solid var(--ink);
  overflow-y:auto;padding:16px 14px 24px}
.form-col .field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;
  border:var(--bw) dashed var(--line);padding:8px 9px;background:var(--panel-2)}
.toggle-row .t{font-size:13px;font-family:var(--ui)}
.run-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.run-row .btn-dark{flex:1;padding:11px 12px}
.cost{font-family:var(--ui);font-size:12px;line-height:1.7;color:var(--ink-2);text-align:center;
  margin-top:10px;border:var(--bw) dashed var(--line);padding:7px 6px;background:var(--panel-2)}
.cost b{background:var(--white);border:var(--bw) solid var(--ink);padding:1px 5px}

.stage{flex:1;overflow-y:auto;position:relative;padding:18px 20px 40px}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;
  border-bottom:var(--bw2) solid var(--ink);padding-bottom:10px}
.stage-head h2{margin:0;font-family:var(--ui);font-size:15px;font-weight:600}
.stage-head .meta{color:var(--ink-3);font-size:12px;font-family:var(--ui)}
.empty{display:flex;align-items:center;justify-content:center;height:58vh;color:var(--ink-3);
  font-family:var(--ui);font-size:13px;
  background-image:var(--bg-pattern);background-size:var(--bg-pattern-size);
  background-position:var(--bg-pattern-pos);border:var(--bw) dashed var(--line)}

/* ---------------- 参考图 ---------------- */
.refs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ref{position:relative;width:54px;height:54px;border:var(--bw) solid var(--ink);overflow:hidden;background:var(--white)}
.ref img{width:100%;height:100%;object-fit:cover;display:block}
.ref button{position:absolute;top:0;right:0;width:18px;height:18px;border:none;background:var(--ink);
  color:var(--white);font-size:11px;line-height:1;cursor:pointer;padding:0}
.drop{border:var(--bw) dashed var(--ink);padding:12px;text-align:center;color:var(--ink-3);font-size:12px;
  cursor:pointer;background:var(--panel-2)}
.drop:hover,.drop.over{background:var(--white);color:var(--ink);border-style:solid}

/* ---------------- 结果卡片 ---------------- */
.card{border:var(--bw) solid var(--ink);background:var(--panel-2);margin-bottom:16px;box-shadow:var(--sh-lg)}
.card-head{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:var(--bw) solid var(--ink);
  background:var(--bg-deep);flex-wrap:wrap}
.card-head .name{font-family:var(--ui);font-weight:600;font-size:13px}
.card-head .m{color:var(--ink-2);font-size:12px;font-family:var(--ui)}
.card-head .acts{margin-left:auto;display:flex;gap:6px}
.badge{font-family:var(--ui);font-size:11px;padding:3px 8px;border:var(--bw) solid var(--ink);
  background:var(--white);color:var(--ink);white-space:nowrap}
.badge.run{background:repeating-linear-gradient(45deg,var(--white) 0 4px,var(--bg-deep) 4px 8px)}
.badge.ok{background:var(--white);font-weight:700}
.badge.err{background:var(--ink);color:var(--white)}
.bar{height:12px;background:var(--bg-deep);border-bottom:var(--bw) solid var(--ink);position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--white);border-right:var(--bw) solid var(--ink);transition:width .3s steps(6)}
.bar.indet i{width:35%!important;animation:slide 1.1s steps(8) infinite;background:repeating-linear-gradient(90deg,var(--white) 0 6px,var(--panel) 6px 12px)}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.card-body{padding:11px}
.prompt{white-space:pre-wrap;word-break:break-word;color:var(--fg-body);font-size:12.5px;line-height:1.65;
  background:var(--panel);border-left:calc(var(--bw) * 2) solid var(--ink);padding:7px 9px}
.prompt.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font-family:var(--ui);font-size:11px;color:var(--ink);background:var(--white);
  border:var(--bw) solid var(--ink);padding:2px 7px}
.err-box{margin-top:9px;font-size:12px;color:var(--white);background:var(--ink);border:var(--bw) solid var(--ink);
  padding:7px 9px;word-break:break-word}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.imgbox{position:relative;border:var(--bw) solid var(--ink);overflow:hidden;background:var(--white);aspect-ratio:1/1;
  box-shadow:var(--sh)}
.imgbox img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.imgbox .ops{position:absolute;inset:auto 0 0 0;display:flex;gap:6px;padding:7px;background:var(--bg-deep);
  border-top:var(--bw) solid var(--ink);opacity:0;transition:opacity .12s steps(2)}
.imgbox:hover .ops{opacity:1}
.imgbox .ops .btn{flex:1;padding:4px 6px;font-size:11px}
.skel{border:var(--bw) solid var(--ink);aspect-ratio:1/1;background:repeating-linear-gradient(45deg,var(--panel) 0 8px,var(--bg-deep) 8px 16px)}

/* ---------------- 灯箱 / toast ---------------- */
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(212,212,212,.97);display:flex;align-items:center;
  justify-content:center;padding:28px}
.lightbox img{max-width:100%;max-height:74vh;border:var(--bw2) solid var(--ink);background:var(--white);
  box-shadow:var(--sh-xl)}
.lb-bar{position:absolute;left:28px;right:28px;bottom:24px;display:flex;gap:10px;align-items:center;
  border:var(--bw) solid var(--ink);padding:9px 11px;background:var(--panel);box-shadow:var(--sh-lg)}
.lb-bar .p{flex:1;font-size:12.5px;color:var(--fg-body);max-height:56px;overflow:auto}
.toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--white);color:var(--ink);border:var(--bw) solid var(--ink);padding:9px 12px;font-size:12px;
  max-width:340px;box-shadow:var(--sh-lg);font-family:var(--ui);
  animation:tin .12s steps(2)}
.toast.err{background:var(--ink);color:var(--white)}
.toast.ok{background:var(--white);font-weight:700}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{width:12px;height:12px;border:var(--bw) solid var(--ink-3);border-top-color:var(--ink);display:inline-block;
  animation:sp .6s steps(4) infinite}
@keyframes sp{to{transform:rotate(360deg)}}


/* ================= 主题：极简模式（大面积淡灰 + 白） ================= */
[data-theme="minimal"]{
  --bg:#f4f5f7; --bg-deep:#fbfbfc; --panel:#ffffff; --panel-2:#f7f8fa;
  --white:#ffffff; --ink:#1f2328; --ink-2:#5a636d; --ink-3:#8b939c;
  --line:#e2e5e9; --shadow:rgba(31,35,40,.10); --fg-body:#333a42; --fg-invert:#ffffff;
  --bw:1px; --bw2:1px; --radius:10px;
  --sh-sm:0 1px 2px rgba(31,35,40,.06);
  --sh:0 2px 8px rgba(31,35,40,.07);
  --sh-lg:0 4px 14px rgba(31,35,40,.10);
  --sh-xl:0 12px 32px rgba(31,35,40,.16);
  --inset:none;
  --img-render:auto;
  --bg-pattern:none; --bg-pattern-size:auto; --bg-pattern-pos:0 0;
}
[data-theme="minimal"] .btn-dark{background:#1f2328;color:#fff}
[data-theme="minimal"] .btn-dark:hover{background:#111417}
[data-theme="minimal"] .btn:hover{transform:none}
[data-theme="minimal"] .btn:active{transform:none}
[data-theme="minimal"] .btn{font-weight:500}
[data-theme="minimal"] .bar{height:6px;border-bottom:none;background:#eceef2;border-radius:999px!important;overflow:hidden}
[data-theme="minimal"] .bar i{background:#1f2328;border-right:none;border-radius:999px!important}
[data-theme="minimal"] .bar.indet i{background:repeating-linear-gradient(90deg,#1f2328 0 8px,#c9ced6 8px 16px)}
[data-theme="minimal"] .badge{font-weight:500}
[data-theme="minimal"] .badge.run{background:#fff8e6;border-color:#f0d9a8;color:#8a6116}
[data-theme="minimal"] .badge.ok{background:#eaf7f0;border-color:#bfe6d2;color:#17694a}
[data-theme="minimal"] .badge.err{background:#fdecef;border-color:#f6ccd4;color:#b03045}
[data-theme="minimal"] .prompt{border-left:3px solid #dfe3e8;background:#fafbfc}
[data-theme="minimal"] .err-box{background:#fdecef;border-color:#f6ccd4;color:#b03045}
[data-theme="minimal"] .logo-mark{image-rendering:auto}
[data-theme="minimal"] .gate-logo{image-rendering:auto}
[data-theme="minimal"] .switch{border-radius:999px!important}
[data-theme="minimal"] .switch::after{border-radius:50%!important;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
[data-theme="minimal"] .switch.on{background:#1f2328}
[data-theme="minimal"] .empty{border-style:dashed;background-image:none}

/* ================= 主题：夜间模式（黑灰） ================= */
[data-theme="night"]{
  --bg:#17191c; --bg-deep:#101214; --panel:#1e2126; --panel-2:#22262b;
  --white:#2a2f36; --ink:#e7eaee; --ink-2:#a6aeb8; --ink-3:#767e88;
  --line:#3a4048; --shadow:rgba(0,0,0,.55); --fg-body:#d3d8de; --fg-invert:#14171a;
  --bw:1px; --bw2:1px; --radius:8px;
  --sh-sm:0 1px 2px rgba(0,0,0,.4);
  --sh:0 2px 10px rgba(0,0,0,.45);
  --sh-lg:0 6px 18px rgba(0,0,0,.5);
  --sh-xl:0 14px 36px rgba(0,0,0,.6);
  --inset:inset 0 1px 0 rgba(255,255,255,.03);
  --img-render:auto;
  --bg-pattern:none; --bg-pattern-size:auto; --bg-pattern-pos:0 0;
}
[data-theme="night"] .btn{background:#262b31;color:var(--ink)}
[data-theme="night"] .btn:hover{background:#2f353d;transform:none}
[data-theme="night"] .btn:active{transform:none}
[data-theme="night"] .btn-dark{background:#e7eaee;color:#14171a}
[data-theme="night"] .btn-dark:hover{background:#fff}
/* 注意：必须用 background-color，用 background 简写会重置下拉箭头的 background-size/position */
[data-theme="night"] .input,[data-theme="night"] select.input,[data-theme="night"] textarea.input{background-color:#14171a;color:var(--ink)}
[data-theme="night"] .checkbox input{background:#14171a}
[data-theme="night"] .checkbox input:checked::after{background:#e7eaee}
[data-theme="night"] .switch{background:#2a2f36}
[data-theme="night"] .switch::after{background:#8b939c}
[data-theme="night"] .switch.on{background:#2b3540}
[data-theme="night"] .switch.on::after{background:#e7eaee}
[data-theme="night"] .bar{height:6px;border-bottom:none;background:#262b31;border-radius:999px!important;overflow:hidden}
[data-theme="night"] .bar i{background:#7fb2ff;border-right:none;border-radius:999px!important}
[data-theme="night"] .bar.indet i{background:repeating-linear-gradient(90deg,#7fb2ff 0 8px,#39414c 8px 16px)}
[data-theme="night"] .badge{background:#262b31}
[data-theme="night"] .badge.run{background:#3a2f18;border-color:#6b5527;color:#f0c675}
[data-theme="night"] .badge.ok{background:#16302a;border-color:#2c5c4d;color:#7fe0b6}
[data-theme="night"] .badge.err{background:#3a1f25;border-color:#6d3641;color:#f5a3b0}
[data-theme="night"] .prompt{background:#1a1d21;border-left:3px solid #3a4048}
[data-theme="night"] .err-box{background:#3a1f25;border-color:#6d3641;color:#f5a3b0}
[data-theme="night"] .chip{background:#262b31}
[data-theme="night"] .cost b{background:#262b31;border-color:var(--ink)}
[data-theme="night"] .toast{background:#262b31}
[data-theme="night"] .toast.err{background:#5a2530;color:#ffe3e8}
[data-theme="night"] .toast.ok{background:#16302a;color:#c9f5e2}
[data-theme="night"] .lightbox{background:rgba(16,18,20,.96)}
[data-theme="night"] .gate .row{background:#14171a}
[data-theme="night"] .logo-mark,[data-theme="night"] .gate-logo{image-rendering:auto;background:#262b31}
[data-theme="night"] .empty{background-image:none}

/* ================= 主题切换器 ================= */
.theme-switch{display:flex;gap:0;border:var(--bw) solid var(--ink);background:var(--panel);overflow:hidden}
.theme-switch button{border:none;border-left:var(--bw) solid var(--ink);background:transparent;color:var(--ink-2);
  font-family:var(--ui);font-size:12px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.theme-switch button:first-child{border-left:none}
.theme-switch button:hover{background:var(--white);color:var(--ink)}

<!-- ==================== 密钥验证门 ==================== -->
<div id="gate" class="gate">
  <div class="gate-card">
    <img class="gate-logo" src="logo.jpg" alt="APIMARTZS" width="56" height="56">
    <h1>APIMARTZS</h1>
    <p class="sub">图像 Playground · APIMart 接口</p>
    <label class="label" for="gateKey">API Key</label>
    <div class="row">
      <input id="gateKey" type="password" placeholder="sk-xxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false">

    </div>
    <label class="checkbox" style="margin-bottom:12px">

    <button id="gateGo" class="btn btn-dark" style="width:100%;padding:10px">验证并进入</button>

    <ul class="tips">

      <li>纯前端页面：浏览器直连 <span style="font-family:monospace">api.aishuch.com</span>（APIMart 接口）</li>
      <li>生成记录存在本机浏览器；图片链接由服务商提供，有效期 24–72 小时</li>

  </div>
</div>

function priceOf(modelId, res) {
  const p = PRICES[modelId];
  if (!p) return null;
  if (res && p.res && p.res[String(res).toUpperCase()] != null) return p.res[String(res).toUpperCase()];
  if (p.res) { const v = Object.values(p.res)[0]; if (v != null) return v; }
  return p.base == null ? null : p.base;
}
function priceTag(modelId) {
  const p = PRICES[modelId];
  if (!p) return '';
  if (p.res) {
    const items = Object.entries(p.res).map(([k,v]) => k + ' ' + credText(v));
    return items.join(' / ');
  }
  return p.base == null ? '' : credText(p.base);
}

/* --------------------------------- API 客户端 -------------------------------- */

async function api(path, { method='GET', body=null, key=null, base=null } = {}) {
  const res = await fetch((base||state.base) + path, {
    method,
    headers: { 'Authorization': 'Bearer ' + (key||state.key), ...(body?{'Content-Type':'application/json'}:{}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let json; try { json = JSON.parse(text); } catch(_) { json = { raw: text }; }
  return { status: res.status, ok: res.ok, json };
}

/** 密钥校验：拉一次模型列表（免费） */
async function verifyKey(key) {
  if (!key) return { ok:false, reason:'请填写 API Key' };
  try {
    const r = await api('/v1/models?expand=category', { key });
    if (r.status === 200 && r.json && Array.isArray(r.json.data)) return { ok:true, models:r.json.data };
    const msg = (r.json && r.json.error && r.json.error.message) || ('HTTP ' + r.status);
    if (r.status === 401) return { ok:false, reason:'API Key 无效或已失效' };
    return { ok:false, reason: msg };
  } catch (err) {
    return { ok:false, reason:'无法连接接口（' + err.message + '）', network:true };
  }
}

/** 提交生成任务 */
async function submitTask(payload) {
  const r = await api('/v1/images/generations', { method:'POST', body:payload });
  if (r.ok && r.json) {
    const d = r.json.data;
    const tid = Array.isArray(d) ? (d[0] && (d[0].task_id || d[0].id)) : (d && (d.task_id || d.id));
    if (tid) return { taskId:tid, raw:r.json };
  }
  const msg = (r.json && r.json.error && r.json.error.message) || (r.json && r.json.message) || ('HTTP ' + r.status);
  const err = new Error(msg); err.status = r.status; err.json = r.json;
  throw err;
}

/** 查询任务 */
async function queryTask(taskId) {
  const r = await api('/v1/tasks/' + encodeURIComponent(taskId));
  return r.json && (r.json.data || r.json);
}

/* IndexedDB 图片缓存 */
const DB='apimartzs', STORE='img';
let dbp=null;
function db(){ if(!dbp) dbp=new Promise((res,rej)=>{ const q=indexedDB.open(DB,1);
  q.onupgradeneeded=()=>{ const d=q.result; if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE); };
  q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); return dbp; }
async function idbPut(k,b){ const d=await db(); return new Promise((res,rej)=>{ const tx=d.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(b,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
async function idbGet(k){ const d=await db(); return new Promise((res,rej)=>{ const tx=d.transaction(STORE,'readonly'); const r=tx.objectStore(STORE).get(k); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }
async function idbDel(k){ const d=await db(); return new Promise((res)=>{ const tx=d.transaction(STORE,'readwrite'); tx.objectStore(STORE).delete(k); tx.oncomplete=res; tx.onerror=res; }); }
async function idbClear(){ const d=await db(); return new Promise((res)=>{ const tx=d.transaction(STORE,'readwrite'); tx.objectStore(STORE).clear(); tx.oncomplete=res; tx.onerror=res; }); }

async function imgSrc(rec, idx) {
  const u = (rec.urls||[])[idx]; if (!u) return '';
  const k = rec.id + ':' + u;
  if (state.blobUrls.has(k)) return state.blobUrls.get(k);
  if (rec.cached) {
    try { const b = await idbGet(k); if (b) { const o=URL.createObjectURL(b); state.blobUrls.set(k,o); return o; } } catch(_){}
  }
  return u;
}

function applyTheme(name, persist){
  const theme = THEMES.includes(name) ? name : 'pixel';
  state.theme = theme;
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll('[data-theme-switch] button').forEach(b=>{
    b.classList.toggle('on', b.dataset.themeBtn === theme);
  });
  if (persist !== false) { try { localStorage.setItem(LS_THEME, theme); } catch(_){} }
}

function bindThemeSwitch(){
  document.querySelectorAll('[data-theme-switch]').forEach(wrap=>{
    wrap.onclick = (e)=>{
      const b = e.target.closest('[data-theme-btn]');
      if (!b) return;
      applyTheme(b.dataset.themeBtn);
    };
  });
}

function renderModelSelect(keep){
  const fam = currentFamily();
  const list = state.models.filter(m => familyOf(m.id) === fam.id);
  const official = state.official && list.some(m=>/-official$/.test(m.id));
  let shown = list;
  if (list.some(m=>/-official$/.test(m.id))) {
    shown = state.official ? list.filter(m=>/-official$/.test(m.id)) : list.filter(m=>!/-official$/.test(m.id));
    if (!shown.length) shown = list;
  }
  $('#modelSel').innerHTML = shown.map(m => {
    const t = priceTag(m.id);
    return `<option value="${esc(m.id)}">${esc(m.id)}${t?(' · '+esc(t)):''}</option>`;
  }).join('');
  if (keep && shown.some(m=>m.id===keep)) {
    $('#modelSel').value = keep;
  } else if (shown.length > 1) {
    const pref = fam.prefer;
    const pick = (pref && shown.find(m=>m.id===pref))
      || shown.find(m=>/(^|-)pro$|-pro-|pro$/.test(m.id))
      || shown.find(m=>/flare|sunburst|max|pro/.test(m.id))
      || shown[0];
    if (pick) $('#modelSel').value = pick.id;
  }
  $('#officialRow').hidden = !list.some(m=>/-official$/.test(m.id));
  onModelChange();
}

function fill(sel, values, keep){
  sel.innerHTML = values.map(v=>`<option value="${esc(v.v)}">${esc(v.t)}</option>`).join('');
  if (keep!=null && values.some(x=>x.v===keep)) sel.value = keep;
}

function onModelChange(){
  const fam = effectiveCfg(currentFamily(), currentModelId());
  const id = currentModelId();
  const m = state.byId.get(id);

  // 分辨率
  const hasRes = !!(fam.resolutions && fam.resolutions.length);
  $('#resolutionField').querySelector('.row2').style.gridTemplateColumns = hasRes ? '1fr 1fr' : '1fr';
  $('#resolutionSel').parentElement.hidden = !hasRes;
  if (hasRes) {
    const keepRes = $('#resolutionSel').value;   // 保留用户当前选择，避免被默认值覆盖
    const wantRes = (keepRes && fam.resolutions.includes(keepRes)) ? keepRes : defaultResolution(fam, id);
    fill($('#resolutionSel'), fam.resolutions.map(r=>({v:r,t:r.toUpperCase()+(priceOf(id,r)?(' · '+credText(priceOf(id,r))):'')})), wantRes);
  } else {
    $('#resolutionSel').innerHTML = '';
    $('#resolutionWrap') && ($('#resolutionWrap').hidden = true);
  }
  // 宽高比
  const curRes = hasRes ? $('#resolutionSel').value : (fam.resolutions ? fam.resolutions[0] : null);
  const famId = currentFamily().id;
  fill($('#sizeSel'), fam.sizes.map(s=>({ v:s, t: s==='auto' ? 'auto' : (pxOf(famId,curRes,s) ? (s+' · '+pxOf(famId,curRes,s).replace('x','×')) : s) })), fam.defaultSize || (fam.sizes.includes('16:9')?'16:9':fam.sizes[0]));
  // 数量
  const maxN = Math.max(1, Math.min(fam.maxN||4, 10));
  fill($('#countSel'), Array.from({length:maxN},(_,i)=>({v:String(i+1),t:String(i+1)})), '1');
  // 质量
  const qw = $('#qualityWrap');
  if (fam.quality && fam.quality.length) {
    qw.hidden = false;
    fill($('#qualitySel'), fam.quality.map(q=>({v:q,t:q})), fam.quality.includes('high')?'high':fam.quality[0]);
  } else qw.hidden = true;

  // 参考图
  const refsOn = !!fam.refs;
  $('#dropZone').style.display = refsOn ? '' : 'none';
  $('#refHint').textContent = refsOn ? `最多 ${fam.maxRefs||4} 张` : '该模型不支持参考图';
  if (!refsOn) { state.refs = []; renderRefs(); }

  $('#modelHint').textContent = (m && (m.capability_tags||[]).join(' · ')) + (fam.note?(' ｜ '+fam.note):'');
  updateCost();
}

function defaultResolution(fam, id){
  if (!fam.resolutions) return null;
  // 默认 1k（用户要求：image-2 / 1k / 16:9）
  return fam.resolutions.includes('1k') ? '1k' : fam.resolutions[0];
}

function updateCost(){
  const id = currentModelId();
  const res = ($('#resolutionSel').value||'').toUpperCase();
  const unit = priceOf(id, res);
  const n = Number($('#countSel').value||1);
  const total = unit==null ? null : unit*n;
  $('#costLine').innerHTML = total==null
    ? '<span class="hint">价格未知（以官网为准）</span>'
    : `${n} 张 · ${credText(unit)}/张 ＝ <b>${credText(total)}</b> <span class="hint">(${money(total)})</span>`;
  const btn = $('#runBtn');
  btn.textContent = 'RUN';
}

/* --------------------------------- 参考图 -------------------------------- */

function renderRefs(){
  $('#refList').innerHTML = state.refs.map((src,i)=>
    `<div class="ref"><img src="${esc(src)}" alt="ref"><button data-i="${i}">✕</button></div>`).join('');
  $('#refList').onclick = (e)=>{ const b=e.target.closest('button'); if(!b) return; state.refs.splice(+b.dataset.i,1); renderRefs(); };
}
function fileToDataUrl(file, maxSide=2048){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('读取失败'));
    fr.onload=()=>{
      const d=String(fr.result);
      if (d.length < 800*1024) return res(d);
      const im=new Image();
      im.onload=()=>{
        const sc=Math.min(1,maxSide/Math.max(im.width,im.height));
        const w=Math.max(1,Math.round(im.width*sc)), h=Math.max(1,Math.round(im.height*sc));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        res(c.toDataURL(/png/i.test(file.type)?'image/png':'image/jpeg',0.9));
      };
      im.onerror=()=>res(d); im.src=d;
    };
    fr.readAsDataURL(file);
  });
}
async function addFiles(files){
  const fam=effectiveCfg(currentFamily(), currentModelId());
  for (const f of Array.from(files)) {
    if (!/^image\//.test(f.type)) { toast('已跳过非图片：'+f.name,'err'); continue; }
    if (f.size > 12*1024*1024) { toast('图片过大（>12MB）：'+f.name,'err'); continue; }
    if (state.refs.length >= (fam.maxRefs||4)) { toast(`参考图最多 ${fam.maxRefs||4} 张`,'err'); break; }
    try { state.refs.push(await fileToDataUrl(f)); } catch(_){ toast('读取失败：'+f.name,'err'); }
  }
  renderRefs();
}

/* --------------------------------- 生成 -------------------------------- */

function buildPayload(){
  const fam = effectiveCfg(currentFamily(), currentModelId()), id = currentModelId(), prompt = $('#promptInput').value.trim();
  const p = { model:id, prompt, n:Number($('#countSel').value||1) };
  const res = $('#resolutionSel').value;
  if (fam.resolutions && fam.resolutions.length && res) p.resolution = res;
  const size = $('#sizeSel').value;
  if (size) {
    if (/^grok-imagine-2/.test(id)) p.aspect_ratio = size; else p.size = size;
  }
  if (fam.quality && fam.quality.length) p.quality = $('#qualitySel').value;
  if (state.refs.length && fam.refs) p.image_urls = state.refs.slice(0, fam.maxRefs||4);
  if ($('#moderationChk').checked) p.moderation = true;
  return p;
}

async function run(){
  const prompt = $('#promptInput').value.trim();
  if (!prompt) { toast('请先填写提示词','err'); $('#promptInput').focus(); return; }
  const payload = buildPayload();
  const id = payload.model, fam = effectiveCfg(currentFamily(), payload.model);
  const btn = $('#runBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';

  const rec = addRecord({
    id: 'task_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    model: id, family: fam.id, label: fam.label,
    prompt, params: { ...payload, image_urls: undefined, prompt: undefined },
    refCount: state.refs.length, status: 'running', progress: 0,
    ts: Date.now(), startedAt: Date.now(), urls: [], error: null, cost: null, credits: null,
  });
  renderStage();

  try {
    const { taskId } = await submitTask(payload);
    updateRecord(rec.id, { taskId });
    pollTask(rec.id, taskId);
  } catch (err) {
    updateRecord(rec.id, { status:'failed', error: err.message, durationMs: Date.now()-rec.startedAt });
    renderStage();
    toast('提交失败：' + err.message, 'err');
    btn.disabled = false; btn.textContent = 'RUN';
  }
}

function pollTask(recId, taskId){
  const started = Date.now();
  const tick = async () => {
    const rec = state.history.find(r=>r.id===recId);
    if (!rec || rec.status !== 'running') return;
    if (Date.now()-started > 10*60*1000) {
      updateRecord(recId, { status:'failed', error:'超时（超过 10 分钟未完成）', durationMs: Date.now()-started });
      renderStage(); return;
    }
    try {
      const d = await queryTask(taskId);
      const st = d.status;
      if (st) updateRecord(recId, { progress: d.progress ?? rec.progress, upstream: st });
      if (st === 'completed') {
        const imgs = (d.result && d.result.images) || [];
        const urls = imgs.map(x => Array.isArray(x.url) ? x.url[0] : x.url).filter(Boolean);
        const cached = {};
        // 图床多数不支持跨域：仅在允许时才缓存到 IndexedDB（失败静默，不影响显示）
        for (const u of urls) {
          try { const r = await fetch(u, { mode:'cors' }); if (r.ok) { await idbPut(recId+':'+u, await r.blob()); cached[u]=1; } } catch(_){}
        }
        updateRecord(recId, {
          status:'succeeded', progress:100, urls, cached: Object.keys(cached).length>0,
          cost: d.cost ?? null, credits: d.credits_cost ?? null,
          durationMs: Date.now()-started, expiresAt: imgs[0] && imgs[0].expires_at || null,
        });
        renderStage(); toast('生成完成','ok');
        return;
      }
      if (st === 'failed') {
        const msg = (d.error && (d.error.message || d.error.code)) || '生成失败';
        updateRecord(recId, { status:'failed', error: msg, durationMs: Date.now()-started });
        renderStage(); toast('生成失败：'+msg,'err'); return;
      }
    } catch(err) { /* 网络抖动继续轮询 */ }
    state.pollers.set(recId, setTimeout(tick, 3000));
  };
  state.pollers.set(recId, setTimeout(tick, 2500));
  $('#runBtn').disabled = false; $('#runBtn').textContent = 'RUN';
}

/* --------------------------------- 渲染 -------------------------------- */

function paramsChips(rec){
  const p = rec.params || {}, out = [];
  if (p.resolution) out.push('分辨率 ' + String(p.resolution).toUpperCase());
  if (p.size) out.push('宽高比 ' + p.size);
  if (p.aspect_ratio) out.push('宽高比 ' + p.aspect_ratio);
  if (p.n) out.push('数量 ' + p.n);
  if (p.quality) out.push('质量 ' + p.quality);
  if (rec.refCount) out.push('参考图 ' + rec.refCount);
  return out.map(t=>`<span class="chip">${esc(t)}</span>`).join('');
}
function statusBadge(rec){
  const map = { running:['run','生成中'], succeeded:['ok','已完成'], failed:['err','失败'] };
  const [cls,txt] = map[rec.status] || ['', rec.status];
  return `<span class="badge ${cls}">${esc(txt)}</span>`;
}

function cardHtml(rec){
  const running = rec.status === 'running';
  const imgs = (rec.urls||[]).map((u,i)=>`
    <div class="imgbox" data-idx="${i}">
      <img data-idx="${i}" alt="result">
      <div class="ops">
        <button class="btn btn-sm" data-act="view" data-idx="${i}">查看</button>
        <button class="btn btn-sm" data-act="download" data-idx="${i}">下载</button>
      </div>
    </div>`).join('');
  return `
  <div class="card" data-id="${esc(rec.id)}">
    <div class="card-head">
      ${statusBadge(rec)}
      <span class="name">${esc(rec.model)}</span>
      <span class="m">${esc(fmtTime(rec.ts))}${rec.durationMs?(' · '+esc(fmtDur(rec.durationMs))):''}${rec.credits?(' · '+esc(rec.credits)+' CREDITS'):''}</span>
      <span class="acts">
        <button class="btn btn-sm" data-act="reuse">复用参数</button>
        <button class="btn btn-sm" data-act="copy">复制提示词</button>
        <button class="btn btn-sm" data-act="del">删除</button>
      </span>
    </div>
    ${running?`<div class="bar indet"><i></i></div>`:`<div class="bar"><i style="width:${rec.status==='succeeded'?100:0}%"></i></div>`}
    <div class="card-body">
      <div class="prompt clamp">${esc(rec.prompt)}</div>
      <div class="chips">${paramsChips(rec)}</div>
      ${rec.error?`<div class="err-box">${esc(rec.error)}</div>`:''}
      ${rec.urls&&rec.urls.length?`<div class="imgs">${imgs}</div>`:(running?'<div class="imgs"><div class="skel"></div></div>':'')}
      ${running?'<div class="hint" style="margin-top:8px">任务已提交，正在生成…（通常 20–60 秒）</div>':''}
      ${rec.urls&&rec.urls.length?`<div class="hint" style="margin-top:8px">${rec.expiresAt?('图片链接有效期至 '+esc(fmtTime(rec.expiresAt*1000))+'，'):''}图床不支持跨域，请用「下载」按钮保存到本地</div>`:''}
    </div>
  </div>`;
}

function renderStage(){
  const body = $('#stageBody');
  const list = state.view === 'history' ? state.history.slice() : state.history.slice(0, 20);
  $('#stageTitle').textContent = state.view === 'history' ? '生成记录' : '生成结果';
  $('#stageMeta').textContent = state.history.length ? `共 ${state.history.length} 条记录 · 图片链接由服务商限时提供，请及时下载` : '';
  if (!list.length) { body.innerHTML = '<div class="empty">暂无生成记录。</div>'; return; }
  body.innerHTML = list.map(cardHtml).join('');
  body.querySelectorAll('img[data-idx]').forEach(async (img)=>{
    const card = img.closest('.card'); const rec = state.history.find(r=>r.id===card.dataset.id);
    if (rec) img.src = await imgSrc(rec, +img.dataset.idx);
  });
  body.onclick = async (e)=>{
    const card = e.target.closest('.card'); if (!card) return;
    const rec = state.history.find(r=>r.id===card.dataset.id);
    if (!rec) return;
    const img = e.target.closest('img[data-idx]');
    if (img) { openLb(rec, +img.dataset.idx); return; }
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const act = btn.dataset.act;
    if (act==='copy') { navigator.clipboard.writeText(rec.prompt); toast('提示词已复制','ok'); }
    else if (act==='reuse') reuse(rec);
    else if (act==='view') openLb(rec, +btn.dataset.idx);
    else if (act==='download') download(rec, +btn.dataset.idx);
    else if (act==='del') {
      if (!confirm('删除这条记录？（同时删除本机缓存图片）')) return;
      for (const u of rec.urls||[]) await idbDel(rec.id+':'+u);
      state.history = state.history.filter(r=>r.id!==rec.id); saveHistory(); renderStage();
    }
  };
}

function reuse(rec){
  const fam = FAMILIES.find(f=>f.id===rec.family) || FAMILIES[0];
  state.official = /-official$/.test(rec.model);
  $('#familySel').value = fam.id;
  renderModelSelect(rec.model);
  $('#promptInput').value = rec.prompt || '';
  const p = rec.params||{};
  if (p.resolution) $('#resolutionSel').value = p.resolution;
  if (p.size) $('#sizeSel').value = p.size;
  if (p.aspect_ratio) $('#sizeSel').value = p.aspect_ratio;
  if (p.n) $('#countSel').value = String(p.n);
  if (p.quality) $('#qualitySel').value = p.quality;
  updateCost();
  toast('参数已回填','ok');
}

async function download(rec, idx){
  const u = (rec.urls||[])[idx]; if (!u) return;
  const name = slug(rec.prompt) + (idx?('-'+idx):'') + '.png';
  // 图床（getapib.org / CloudFront）不返回 CORS 头，前端无法直接抓二进制；
  // 若已缓存到 IndexedDB 则直接下载，否则在新标签页打开由浏览器保存。
  try {
    const blob = rec.cached ? await idbGet(rec.id+':'+u) : null;
    if (!blob) throw new Error('no-cache');
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  } catch(_) {
    window.open(u, '_blank');
    toast('已在新标签页打开原图：右键「图片另存为」即可保存');
  }
}

async function openLb(rec, idx){
  $('#lightbox').hidden = false;
  $('#lbImg').src = await imgSrc(rec, idx);
  $('#lbPrompt').textContent = rec.prompt || '';
  $('#lbCopy').onclick = ()=>{ navigator.clipboard.writeText(rec.prompt||''); toast('提示词已复制','ok'); };
  $('#lbDownload').onclick = ()=>download(rec, idx);
}
function closeLb(){ $('#lightbox').hidden = true; $('#lbImg').src=''; }

/* --------------------------------- 视图 -------------------------------- */

function switchView(view){
  state.view = view;
  $('#formCol').hidden = false;
  $$('.side-nav button[data-cat]').forEach(b=>b.classList.toggle('active', b.dataset.cat===view));
  renderStage();
}

/* --------------------------------- 启动 -------------------------------- */

function gateMsg(t, ok){ const el=$('#gateMsg'); el.textContent=t||''; el.className='msg'+(ok?' ok':''); }

async function doVerify(key, silent){
  if (!silent) gateMsg('正在校验密钥…', true);
  const v = await verifyKey(key);
  if (!v.ok) { if (!silent) gateMsg(v.reason); return false; }
  state.key = key;
  state.models = (v.models||[]).filter(m => m.category === 'image' || familyOf(m.id));
  state.byId = new Map(state.models.map(m=>[m.id,m]));
  if ($('#gateRemember').checked) localStorage.setItem(LS_KEY, key); else localStorage.removeItem(LS_KEY);
  enterApp();
  if (!silent) toast('验证成功','ok');
  return true;
}

function enterApp(){
  $('#gate').hidden = true;
  $('#app').hidden = false;
  $('#gateSwitch').hidden = true;
  renderFamilySelect();
  // 默认：gpt-image-2 / 1k / 16:9
  const fam = FAMILIES.find(f=>f.id==='gpt-image-2');
  $('#familySel').value = 'gpt-image-2';
  renderModelSelect('gpt-image-2');
  $('#promptInput').value = 'cute things.';
  renderStage();
}

function bind(){
  $('#gateGo').onclick = ()=>doVerify($('#gateKey').value.trim());
  $('#gateKey').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#gateGo').click(); });
  $('#gateEye').onclick = ()=>{ const i=$('#gateKey'); i.type = i.type==='password'?'text':'password'; $('#gateEye').textContent = i.type==='password'?'显示':'隐藏'; };

  $('#familySel').onchange = ()=>renderModelSelect();
  $('#modelSel').onchange = onModelChange;
  $('#resolutionSel').onchange = ()=>{ onModelChange(); updateCost(); };
  ['#sizeSel','#countSel','#qualitySel'].forEach(s=>$(s).onchange = updateCost);
  $('#officialSw').onclick = ()=>{
    state.official = !state.official;
    $('#officialSw').classList.toggle('on', state.official);
    renderModelSelect(currentModelId());
  };
  $('#promptChips').innerHTML = ['cute things.','赛博朋克城市夜景，霓虹灯反射在湿润街道','极简产品摄影：白底香水瓶，柔和阴影','国潮插画海报，红金配色']
    .map((p,i)=>`<span class="chip" style="cursor:pointer" data-p="${i}">${esc(p.slice(0,16))}</span>`).join('');
  $('#promptChips').onclick = (e)=>{ const c=e.target.closest('[data-p]'); if(c) $('#promptInput').value = $('#promptChips').querySelectorAll('[data-p]')[+c.dataset.p].textContent; };

  $('#dropZone').onclick = ()=>$('#fileInput').click();
  $('#fileInput').onchange = e=>{ addFiles(e.target.files); e.target.value=''; };
  ['dragenter','dragover'].forEach(ev=>$('#dropZone').addEventListener(ev,e=>{e.preventDefault();$('#dropZone').classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>$('#dropZone').addEventListener(ev,e=>{e.preventDefault();$('#dropZone').classList.remove('over');}));
  $('#dropZone').addEventListener('drop', e=>{ if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

  $('#runBtn').onclick = run;
  $('#resetBtn').onclick = ()=>{ $('#promptInput').value=''; state.refs=[]; renderRefs(); onModelChange(); };
  $('#btnHistory').onclick = ()=>switchView('history');
  $$('.side-nav button[data-cat]').forEach(b=>b.onclick = ()=>switchView('image'));
  $('#lbClose').onclick = closeLb;
  $('#lightbox').onclick = e=>{ if(e.target.id==='lightbox') closeLb(); };
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLb(); });
}

(function boot(){
  applyTheme(localStorage.getItem(LS_THEME) || 'pixel', false);
  bindThemeSwitch();
  bind();
  loadHistory();
  $('#gateSwitch').hidden = false;
  const saved = localStorage.getItem(LS_KEY);
  if (saved) { $('#gateKey').value = saved; doVerify(saved, true).then(ok=>{ if(!ok) gateMsg('已保存的密钥校验失败，请重新输入'); }); }
})();
</script>
